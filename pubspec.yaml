name: orca_secure_storage
description: Encrypted, fast key-value storage for Flutter (AES-256-GCM, compressed, written off the UI thread). Based on get_secure_storage and get_storage.
version: 2.1.6
homepage: https://github.com/aminjoharinia/OrcaSecureStorage
repository: https://github.com/aminjoharinia/OrcaSecureStorage

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  get: ">=4.0.0 <6.0.0"
  path_provider: ^2.1.2
  # Only for reading 1.x files (AES-128-CTR + HMAC envelope).
  cryptography: ^2.7.0
  # AES-256-GCM and PBKDF2 via BoringSSL (FFI) or the browser's WebCrypto.
  webcrypto: ^0.6.1
  web: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
